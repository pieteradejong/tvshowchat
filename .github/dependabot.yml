# Version-update PRs, weekly and grouped. Every pin in this repo is exact, so
# nothing updates by itself; these PRs are the deliberate path, and CI
# (including the search ranking baseline) has to pass before merging.
#
# For Python, Dependabot edits pyproject.toml / requirements-dev.in; the
# `lockfiles` check then fails until someone runs ./scripts/lock.sh and
# commits the regenerated hash lock — a human reviews every new hash.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
