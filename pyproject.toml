# Runtime dependencies, pinned exactly. This is the input; requirements.txt is
# the hash-locked output — edit here, then run ./scripts/lock.sh. Dev tools are
# in requirements-dev.in.
[project]
name = "tvshowchat"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    # Web framework
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    # Scraping
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "ratelimit==2.2.1",
    "tenacity==9.1.4",
    # Embeddings
    "sentence-transformers==6.1.0",
    "torch==2.14.1",
    "numpy==2.5.3",
    "tqdm==4.70.1",
]

# torch comes from PyTorch's CPU-only index: the PyPI Linux wheel pulls ~20
# CUDA/nvidia packages (several GB) that this CPU-only service never uses.
# `explicit = true` means only torch may resolve from it — every other package
# still comes from PyPI — and the hash lock rejects any artifact not locked.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
