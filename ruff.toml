# Explicit rule set, so a ruff upgrade never changes what CI enforces.
target-version = "py312"
extend-exclude = ["venv", "frontend", "app/models"]

[lint]
# pyflakes, pycodestyle errors, bandit (security), bugbear
select = ["F", "E4", "E7", "E9", "S", "B"]
ignore = [
    "S101",  # assert is how pytest works
    "S311",  # random is not used for security here
    "B008",  # FastAPI's Depends() in defaults is the framework idiom
]

[lint.per-file-ignores]
"tests/**" = ["S"]
"scripts/eval_retrieval.py" = ["S"]
