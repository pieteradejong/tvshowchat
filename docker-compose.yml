# Docker Compose configuration for local development and testing
# This allows you to test the Docker setup locally before deploying to Render

version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tvshowchat-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      # Mount data directory for persistence (optional)
      - ./app/data:/app/app/data
      # Mount logs directory (optional)
      - ./app/logs:/app/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); s.settimeout(1); result = s.connect_ex(('localhost', 8000)); s.close(); exit(0 if result == 0 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

