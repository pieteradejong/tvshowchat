# Render Blueprint Configuration
# This file defines the services for deployment on Render
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: tvshowchat-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main  # Ensure we use the latest main branch
    plan: starter  # 512MB RAM - should work after optimizations
    # plan: standard  # 2GB RAM - recommended for production
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: PYTHONDONTWRITEBYTECODE
        value: 1
      - key: PORT
        value: 8000
    healthCheckPath: /health
    # Disabled during the multi-show / lightweight-engine refactor: the starter plan
    # has no headroom. Re-enable once the Vercel cutover is verified — with
    # `checksPass`, never `commit`, so a push to main deploys only after every CI
    # check (lint, tests, audits, image smoke test, CodeQL, security) is green.
    # (`autoDeployTrigger` replaces Render's deprecated `autoDeploy` field; `off`
    # is the same setting as the old `autoDeploy: false`.)
    autoDeployTrigger: "off"
    # Build command is handled by Dockerfile
    # Start command is handled by Dockerfile CMD

